# VPS с собственным доменом: приложение + Caddy (автоматический HTTPS от Let's Encrypt).
# Запуск: DOMAIN=deanate.example.ru docker compose -f deploy/docker-compose.prod.yml up -d --build
services:
  app:
    build: ..
    environment:
      COOKIE_SECURE: "true"
      TRUST_PROXY_HEADERS: "true"
      UNIVERSITY_NAME: "${UNIVERSITY_NAME:-Технический университет}"
    volumes:
      - deanate-data:/data
    restart: unless-stopped
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: "${DOMAIN:?Укажите DOMAIN}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      - app
    restart: unless-stopped
volumes:
  deanate-data:
  caddy-data:
